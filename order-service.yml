server:
  port: 8083

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/orderdb
    username: ${ORDER_DB_USERNAME}
    password: ${ORDER_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

user-service:
  url: http://localhost:8081

product-service:
  url: http://localhost:8082
